name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不再用 android-actions/setup-android：它内部会执行 sdkmanager "tools"，
      # 而新版 runner 的 cmdline-tools 已不再提供 tools 包，那一步会直接失败。
      # runner 本身预装了 Android SDK，这里只补齐本项目需要的 platform 与 build-tools。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "找不到预装的 Android SDK：$SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -n "$SDKMGR" ]; then
            echo "sdkmanager: $SDKMGR"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

          echo "SDK 就绪："
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 debug 包
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 回退判定跑在 JVM 单元测试里（app/src/test/.../GuardDecisionTest.kt）。
      #
      # 这一步不能省：「什么时候该按返回」依赖一堆时序条件，真机上几乎无法
      # 稳定复现，用户自己都说不清是哪一步触发的。除了拿真机碰运气，
      # 唯一能长期维护的办法就是这套断言——谁改了判定逻辑、谁动了名单，
      # CI 一跑就知道有没有把「用户主动打开某个 App」误判成「广告跳转」。
      - name: 跑单元测试（回退判定矩阵）
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AdSkipper-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
